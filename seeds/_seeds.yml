version: 2

seeds:
  # --- reference ---
  - name: entity
    description: "Entity register. 11 fully-consolidated entities + Uganda Associate (equity)."
    columns:
      - name: entity_code
        tests: [not_null, unique]
      - name: functional_ccy
        tests: [not_null]

  - name: statement_line
    description: "Canonical SCI / SFP line catalogue."
    columns:
      - name: statement_line_code
        tests: [not_null, unique]
      - name: tb_category
        description: >
          The client's own grouping — column A of the `KES consolidated TB` tab,
          the 24-category template. Our 51 statement lines collapse onto it
          many-to-one, so it lives here rather than in a separate mapping table,
          and it surfaces on dim_statement_line and every reporting mart so Power
          BI can group the TB and the statements the way Finance's workbook does.
          Derived by joining the client's `No.` column to account_map across all
          six Consolidated Accounts packs. Two judgement calls are still open with
          Finance: accrued_income -> 'Other receivables', and net_profit ->
          'Retained earnings' (their TB has no separate Net Profit row).
        tests: [not_null]

  - name: account_map
    description: "Per-entity local account -> statement line mapping. TODO: lift from Consolidated TB workbook formulas."
    columns:
      - name: company_name
        tests: [not_null]
      - name: local_account_no
        tests: [not_null]

  - name: budget
    description: >
      Group P&L budget at management-line grain (report_line_code x period),
      Jan-Jun 2026. Generated by
      Scripts/extract_budget.py from the client's Budget and LYTD Comparison
      workbook - do not hand-edit. The workbook's columns are MTD, so each
      period here is the cumulative sum to that month. Expenses are stored
      NEGATIVE on this seed, matching report_line.presentation_sign.
    columns:
      - name: report_line_code
        tests: [not_null]
      - name: period
        tests: [not_null]

  - name: budget_subsidiary
    description: >
      The same budget at SUBSIDIARY grain
      (company_name x statement_line_code x period), which rpt_group_pl cannot
      show because its taxonomy pools the four Kenyan entities into by-nature
      expense lines and the five African entities into a single Zarinet total.
      Joined onto rpt_subsidiary_sci. No allocation is involved - the source
      workbook is already at entity x line grain and all 22 of its labels map
      1:1 onto our SCI statement lines.

      Expenses are stored POSITIVE here, unlike the `budget` seed, because this
      seed sits beside amount_kes on the presentation basis where sign_multiplier
      has already flipped income and expenses both positive. A budget column
      whose sign did not match the actual next to it would be unusable.
      Consequence: on an expense line a positive variance means overspend, which
      is the opposite of rpt_group_pl. See rpt_subsidiary_sci.

      `taxation` is absent (the workbook stops at profit before tax) and so is
      Uganda (equity-accounted, not in the budget pack).

      Neither budget seed carries prior year. The source workbook has an LYMTD
      column, but prior year should be derived from our own actuals once a full
      year exists rather than imported from the client's comparative - see the
      fiscal-year note in README.md.
    columns:
      - name: company_name
        tests: [not_null]
      - name: statement_line_code
        tests: [not_null]
      - name: period
        tests: [not_null]

  - name: fx_rate
    description: "Closing and Average FX rates by currency-period. Closing is applied to the SFP and Average to the SCI, matching how the client uses their own Rates tab."

  - name: tax_rate
    description: >
      Tax rate for the entity-periods where the client computes the charge as a
      percentage of profit before tax because the trial balance carries no tax
      account (ZATL, C&P, Rwanda, Nigeria, and ZAMRE/ZARIB in January). Consumed
      by int_computed_tax. Rows exist ONLY for computed periods; anywhere else
      the charge comes from a real account via account_map.
    columns:
      - name: company_name
        tests: [not_null]
      - name: period
        tests: [not_null]
      - name: tax_rate
        tests: [not_null]

  - name: elimination_journal
    description: "Intercompany elimination journal. Empty today; populated as IC pairs are identified in Module A."

  # --- bronze (per-entity raw — replaced by Fabric tables at switch time) ---
  - name: gl_entry_zaac
    description: "BC Table 17 (G/L Entry) for ZAAC, loaded from workbook for the demo."
  - name: gl_entry_zarib
  - name: gl_entry_zamre
  - name: gl_entry_zhl
  - name: gl_entry_zatl
  - name: gl_entry_c_p
  - name: gl_entry_mena
    description: "MENA — descriptive lines, no account codes. Custom column shape — see seed CSV."
  - name: gl_entry_malawi
  - name: gl_entry_nigeria
    description: "Nigeria — descriptive lines with Category column. Custom column shape — see seed CSV."
  - name: gl_entry_rwanda
  - name: gl_entry_drc
  - name: gl_entry_uganda_assoc
    description: "Uganda Associate — equity-accounted. Carries only share-of-profit and investment-carrying-value rows."

  - name: gl_account_zaac
  - name: gl_account_zarib
  - name: gl_account_zamre
  - name: gl_account_zhl
  - name: gl_account_zatl
  - name: gl_account_c_p
  - name: gl_account_mena
  - name: gl_account_malawi
  - name: gl_account_nigeria
  - name: gl_account_rwanda
  - name: gl_account_drc
  - name: gl_account_uganda_assoc

  - name: tb_accrual
    description: >
      The client's `Accruals` column from the individual TB tabs, per account per
      period, as monthly movements. ZAAC, ZARIB and C&P only — no other entity's tab
      carries the column. Written by Scripts/extract_accruals.py; joined back in
      stg_tb_accrual and rpt_subsidiary_tb so the five TB columns can be shown
      separately WITHOUT putting a non-BC column on the bronze gl_entry seeds.
      The bronze figure is already post-accrual, so `amount` is derived as
      after − accruals; this seed cannot move a reported figure, only decompose it.
    columns:
      - name: company_name
        tests: [not_null]
      - name: period
        tests: [not_null]
      - name: accrual_local
        tests: [not_null]
